<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Recipes</title>
    <style>
        html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
      }
      embed {
        width: 100%;
        height: 100%;
      }
    </style>
    <script>
      document.addEventListener('DOMContentLoaded', () => {
        const embed = document.createElement('embed');
        embed.src = `recipes.pdf?t=${Date.now()}`;
        embed.type = 'application/pdf';
        document.body.appendChild(embed);
      });
    </script>
  </head>
  <body></body>
</html>
